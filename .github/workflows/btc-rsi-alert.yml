name: Cripto RSI 1h Alert (BTC + ETH)

on:
  # Deshabilitado: se reemplazó por el reporte semanal de oportunidades
  # de largo plazo (long-term-opportunity-report.yml). Se deja solo el
  # disparo manual por si hace falta reactivarlo puntualmente.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-rsi-alert
  cancel-in-progress: false

jobs:
  check-rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chequear RSI de BTC y notificar si corresponde
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/btc-rsi-alert.mjs

      - name: Chequear RSI de ETH y notificar si corresponde
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/eth-rsi-alert.mjs

      - name: Guardar estado si cambió
        run: |
          if ! git diff --quiet -- data/rsi-alert-state.json data/eth-rsi-alert-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/rsi-alert-state.json data/eth-rsi-alert-state.json
            git commit -m "chore: actualizar estado de alerta RSI BTC/ETH"
            git push
          else
            echo "Sin cambios de estado."
          fi
