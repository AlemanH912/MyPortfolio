name: Price Target Alert

on:
  schedule:
    # Cada 15 minutos.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-target-alert
  cancel-in-progress: false

jobs:
  check-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chequear targets de precio y notificar si corresponde
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/price-target-alert.mjs

      - name: Guardar estado si cambió
        run: |
          if ! git diff --quiet -- data/price-target-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/price-target-state.json
            git commit -m "chore: actualizar estado de targets de precio"
            git push
          else
            echo "Sin cambios de estado."
          fi
