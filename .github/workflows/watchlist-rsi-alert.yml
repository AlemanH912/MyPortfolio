name: Watchlist RSI Diario

on:
  # Deshabilitado: se reemplazó por el reporte semanal de oportunidades
  # de largo plazo (long-term-opportunity-report.yml). Se deja solo el
  # disparo manual por si hace falta reactivarlo puntualmente.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watchlist-rsi-alert
  cancel-in-progress: false

jobs:
  check-watchlist-rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chequear RSI diario de la watchlist y notificar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/watchlist-rsi-alert.mjs

      - name: Guardar estado si cambió
        run: |
          if ! git diff --quiet -- data/watchlist-rsi-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/watchlist-rsi-state.json
            git commit -m "chore: actualizar estado de alerta RSI watchlist"
            git push
          else
            echo "Sin cambios de estado."
          fi
