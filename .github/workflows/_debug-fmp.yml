name: Debug FMP (temporal)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ver forma real de la respuesta de FMP
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/_debug-fmp.mjs
